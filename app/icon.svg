<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Spark / Gap Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Calendar Container Card -->
  <g filter="url(#shadow)" transform="translate(80, 80)">
    <!-- Base White Card -->
    <rect width="352" height="352" rx="56" fill="#ffffff" />

    <!-- Calendar Red/Blue Header Bar -->
    <path d="M 0 56 C 0 25.07 25.07 0 56 0 L 296 0 C 326.93 0 352 25.07 352 56 L 352 96 L 0 96 Z" fill="url(#headerGrad)" />

    <!-- Left Binder Ring -->
    <rect x="76" y="-18" width="32" height="52" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="4" />
    <!-- Right Binder Ring -->
    <rect x="244" y="-18" width="32" height="52" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="4" />

    <!-- Calendar Grid - Day Dots -->
    <!-- Row 1 -->
    <circle cx="88" cy="160" r="18" fill="#cbd5e1" />
    <circle cx="176" cy="160" r="18" fill="#cbd5e1" />
    <circle cx="264" cy="160" r="18" fill="#3b82f6" />

    <!-- Row 2 -->
    <circle cx="88" cy="236" r="18" fill="#3b82f6" />
    <circle cx="176" cy="236" r="18" fill="#cbd5e1" />
    <circle cx="264" cy="236" r="18" fill="#cbd5e1" />

    <!-- DateGap Connector Arc: Highlighting the "Gap" between dates -->
    <path d="M 88 236 Q 176 180 264 160" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 18" />

    <!-- Central Sparkle / Clock Accent -->
    <circle cx="176" cy="286" r="32" fill="url(#bgGrad)" />
    <!-- Mini Clock / Spark Hands -->
    <path d="M 176 268 L 176 286 L 188 286" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

